<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Student Card</title>
</head>

<body>

    <div class="card">

        <img src="студентка молоденькая.jpg"
             alt="student">

        <div id="info">
            <ul>
                <li>Name: <span id="name"></span></li>
                <li>Age: <span id="age"></span></li>
                <li>Faculty: <span id="faculty"></span></li>
                <li>Year: <span id="year"></span></li>
                <li id="result"></li>
            </ul>
        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
